# Fill these only from field semantics/documentation and the structure report.
# Do not inspect any model output because no model output should exist yet.
cell_schema:
  container_or_member_pattern: REPLACE_FROM_STRUCTURE_REPORT
  physical_cell_id_field: REPLACE_FROM_STRUCTURE_REPORT
  cohort_field: REPLACE_FROM_STRUCTURE_REPORT
  cohort_value_map:
    fixed_profile: REPLACE_FROM_STRUCTURE_REPORT
    arbitrary_use: REPLACE_FROM_STRUCTURE_REPORT
  physical_aging_cycle_field: REPLACE_FROM_STRUCTURE_REPORT
  capacity_field: REPLACE_FROM_STRUCTURE_REPORT
  capacity_unit: Ah
  declared_nominal_capacity_Ah: 2.4

resolved_structure:
  cell_manifest_csv: REPLACE_WITH_STRUCTURE_ONLY_CELL_MANIFEST
  actual_total_cells: REPLACE_WITH_INTEGER
  actual_fixed_profile_cells: REPLACE_WITH_INTEGER
  actual_arbitrary_use_cells: REPLACE_WITH_INTEGER
