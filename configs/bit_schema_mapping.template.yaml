parser:
  source_file: REPLACE_WITH_FROZEN_BIT_PARSER_SOURCE
  source_sha256: REPLACE_FROM_LOCAL_SHA256
  executed_on_capacity_values_before_freeze: false
  imports_model_code: false
  generates_model_output: false

landmark:
  primary_cycle: 190
  index_semantics: physical_aging_cycle_number
  minimum_pre_cutoff_physical_cycles: 20
  minimum_future_valid_soh_observations_for_rmse: 5

normalization:
  primary: median_first_5_valid
  formula: SOH_i_t = C_i_t / median(C_i_first_5_valid)
  eol_threshold_soh: 0.8
  valid_capacity_range_relative_to_declared_nominal: [0.5, 1.5]
  bol_median_quality_range_relative_to_declared_nominal: [0.8, 1.2]
  sensitivity_rules: [first_valid, median_first_3_valid]

future_information:
